<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وب‌سایت من</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 80px 20px;
        }

        h1 {
            font-size: 42px;
        }

        p {
            font-size: 20px;
            line-height: 2;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 30px;
            background: #5865F2;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>به سایت من خوش آمدید</h1>

        <p>
            این اولین وب‌سایت من است که به صورت رایگان آنلاین شده است.
        </p>

        <a class="button" href="https://t.me/" target="_blank">
            ارتباط با من
        </a>

    </div>

</body>
</html>
