            ambientMove2: {

    /* تشخیص تم هوشمند بر اساس تنظیمات سیستم و ساعت شبانه‌روز */
    function resolveInitialTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        return savedTheme;
      }

      // بین ساعت ۶ عصر تا ۶ صبح دارک، در طول روز لایت
      const currentHour = new Date().getHours();
      const isNightTime = (currentHour >= 18 || currentHour < 6);
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

      if (isNightTime || prefersDark) {
        return 'dark';
      }
      return 'light';
    }

    function applyTheme(theme) {
      const html = document.documentElement;
      const themeIcon = document.getElementById('themeIcon');

      if (theme === 'dark') {
        html.classList.add('dark');
        themeIcon.className = "fa-solid fa-moon text-sky-300 text-base";
      } else {
        html.classList.remove('dark');
        themeIcon.className = "fa-solid fa-sun text-amber-500 text-base";
      }
    }

    function initTheme() {
      const theme = resolveInitialTheme();
      applyTheme(theme);

      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
          if (!localStorage.getItem('theme')) {
            applyTheme(e.matches ? 'dark' : 'light');
          }
        });
      }
    }

    function toggleThemeManual() {
      const html = document.documentElement;
      const willBeDark = !html.classList.contains('dark');
      const newTheme = willBeDark ? 'dark' : 'light';

      localStorage.setItem('theme', newTheme);
      applyTheme(newTheme);
      showToast(willBeDark ? 'حالت شب فعال شد 🌙' : 'حالت روز فعال شد ☀️');
    }

    function initProfile() {
      document.getElementById('profileName').innerText = MY_CONFIG.name;
      document.getElementById('profileHandle').innerText = MY_CONFIG.handle;
      document.getElementById('profileBio').innerText = MY_CONFIG.bio;
      document.getElementById('avatarImg').src = MY_CONFIG.avatar;

      renderLinks();
    }

    function renderLinks() {
      const container = document.getElementById('linksList');
      container.innerHTML = '';

      MY_CONFIG.links.forEach((link, index) => {
        const btn = document.createElement('button');
        btn.className = "glass-button group w-full rounded-2xl p-4 flex items-center justify-between overflow-hidden text-right";
        btn.onclick = () => openSmartLink(index);

        btn.innerHTML = `
          <div class="flex items-center gap-3.5">
            <div class="w-12 h-12 rounded-xl ${link.iconBg} ${link.iconColor} border flex items-center justify-center text-xl transition duration-300 shadow-md">
              <i class="${link.icon}"></i>
            </div>
            <div>
              <div class="flex items-center gap-2">
                <h2 class="font-bold text-sm sm:text-base text-slate-800 dark:text-slate-100 ${link.hoverColor} transition">${link.title}</h2>
                ${link.badge ? `<span class="text-[10px] px-2 py-0.5 rounded-full ${link.isComingSoon ? 'bg-amber-500/20 text-amber-600 dark:text-amber-400 border border-amber-400/30' : 'bg-slate-200/80 dark:bg-slate-800/80 text-sky-700 dark:text-sky-300 border border-sky-400/20'} hidden xs:inline">${link.badge}</span>` : ''}
              </div>
              <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 font-light">${link.desc}</p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-arrow-left text-slate-400 dark:text-slate-500 group-hover:text-emerald-500 dark:group-hover:text-phosphor -translate-x-1 group-hover:-translate-x-2 transition duration-300 text-sm"></i>
          </div>
        `;

        container.appendChild(btn);
      });
    }

    /* باز شدن خودکار در اپلیکیشن (Deep Linking) */
    function openSmartLink(index) {
      const item = MY_CONFIG.links[index];

      if (item.isComingSoon || !item.webUrl) {
        showToast('وب‌سایت رسمی به زودی راه‌اندازی خواهد شد 🚀');
        return;
      }

      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      if (isMobile && item.appUrl) {
        const start = Date.now();
        window.location.href = item.appUrl;

        setTimeout(() => {
          if (Date.now() - start < 1800) {
            window.open(item.webUrl, '_blank', 'noopener,noreferrer');
          }
        }, 1200);
      } else {
        window.open(item.webUrl, '_blank', 'noopener,noreferrer');
      }
    }

    /* اشتراک‌‌گذاری صفحه */
    async function shareProfile() {
      const shareData = {
        title: `${MY_CONFIG.name} | پیوندها و شبکه‌های اجتماعی`,
        text: `صفحه رسمی پیوندها و راه‌های ارتباطی ${MY_CONFIG.name}`,
        url: window.location.href
      };

      if (navigator.share && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        try {
          await navigator.share(shareData);
          showToast('صفحه با موفقیت به اشتراک گذاشته شد');
        } catch (err) {
          if (err.name !== 'AbortError') {
            copyProfileLink();
          }
        }
      } else {
        copyProfileLink();
      }
    }

    function copyProfileLink() {
      const url = window.location.href;
      const el = document.createElement('textarea');
      el.value = url;
      document.body.appendChild(el);
      el.select();
      try {
        document.execCommand('copy');
        showToast('نشانی صفحه کپی شد ✨');
      } catch (err) {
        showToast('خطا در کپی آدرس');
      }
      document.body.removeChild(el);
    }

    /* نمایش و ایجاد بارکد QR */
    let isQrGenerated = false;
    function openQrModal() {
      const modal = document.getElementById('qrModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      if (!isQrGenerated) {
        const container = document.getElementById('qrcode');
        container.innerHTML = '';
        new QRCode(container, {
          text: window.location.href,
          width: 170,
          height: 170,
          colorDark: "#050811",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
        isQrGenerated = true;
      }
    }

    function closeQrModal() {
      const modal = document.getElementById('qrModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function showToast(text) {
      const toast = document.getElementById('toastNotification');
      const msg = document.getElementById('toastMsg');
      msg.innerText = text;

      toast.classList.remove('translate-y-32', 'opacity-0', 'pointer-events-none');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-32', 'opacity-0', 'pointer-events-none');
      }, 3000);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      initProfile();
    });
  </script>
</body>
</html>
