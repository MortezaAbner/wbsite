<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مرتضی آبنر | Morteza Abner</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- آیکون‌های استاندارد Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- فونت وزیرمتن فارسی -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- کتابخانه تولید بارکد QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            vazir: ['Vazirmatn', 'sans-serif'],
          },
          colors: {
            'sky-neon': '#38bdf8',
            'phosphor': '#39ff14',
            'phosphor-emerald': '#10b981',
            'dark-base': '#030712',
            'dark-surface': '#091024',
          },
          animation: {
            'ambient-1': 'ambientMove1 14s ease-in-out infinite alternate',
            'ambient-2': 'ambientMove2 16s ease-in-out infinite alternate',
            'pulse-glow': 'pulseGlow 2.5s infinite',
          },
          keyframes: {
            ambientMove1: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '100%': { transform: 'translate(40px, -30px) scale(1.15)' },
            },
            ambientMove2: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '100%': { transform: 'translate(-40px, 35px) scale(0.9)' },
            },
            pulseGlow: {
              '0%, 100%': { opacity: '0.4', transform: 'scale(1)' },
              '50%': { opacity: '0.8', transform: 'scale(1.05)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Vazirmatn', sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* استایل‌های گلس‌مورفیسم حالت شب */
    html.dark body {
      background-color: #030712;
      color: #f1f5f9;
    }

    html.dark .glass-panel {
      background: rgba(9, 16, 36, 0.72);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(56, 189, 248, 0.22);
      box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.8), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
    }

    html.dark .glass-item {
      background: rgba(13, 23, 46, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.16);
      transition: all 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    html.dark .glass-item:hover,
    html.dark .glass-item:focus-visible,
    html.dark .glass-item.tv-focused {
      transform: translateY(-4px) scale(1.015);
      border-color: rgba(57, 255, 20, 0.7);
      background: rgba(18, 32, 64, 0.85);
      box-shadow: 0 12px 28px -6px rgba(56, 189, 248, 0.4), 0 0 20px rgba(57, 255, 20, 0.35);
      outline: none;
    }

    /* استایل‌های گلس‌مورفیسم حالت روز */
    html:not(.dark) body {
      background-color: #edf5ff;
      color: #0f172a;
    }

    html:not(.dark) .glass-panel {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 15px 35px -10px rgba(56, 189, 248, 0.2), inset 0 1px 0 0 rgba(255, 255, 255, 0.8);
    }

    html:not(.dark) .glass-item {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      transition: all 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    html:not(.dark) .glass-item:hover,
    html:not(.dark) .glass-item:focus-visible,
    html:not(.dark) .glass-item.tv-focused {
      transform: translateY(-4px) scale(1.015);
      border-color: rgba(16, 185, 129, 0.8);
      background: #ffffff;
      box-shadow: 0 12px 28px -6px rgba(56, 189, 248, 0.3), 0 0 18px rgba(34, 197, 94, 0.25);
      outline: none;
    }

    /* گرادینت برند آبی آسمانی و فسفری */
    .neon-brand-title {
      background: linear-gradient(135deg, #0284c7 0%, #0284c7 30%, #059669 80%, #10b981 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    html.dark .neon-brand-title {
      background: linear-gradient(135deg, #7dd3fc 0%, #38bdf8 40%, #4ade80 75%, #39ff14 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .neon-glow-ring {
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.5), 0 0 35px rgba(57, 255, 20, 0.3);
    }

    /* تغییرات استایل ویژه حالت تلویزیون (TV Mode) */
    body.device-tv {
      padding: 2.5rem !important;
      font-size: 1.15rem;
    }
    body.device-tv .glass-item {
      padding: 1.6rem !important;
      border-width: 2px;
    }
    body.device-tv .glass-item h2 {
      font-size: 1.35rem !important;
    }
    body.device-tv .glass-item p {
      font-size: 1rem !important;
    }
    body.device-tv .glass-item i {
      font-size: 1.8rem !important;
    }
    body.device-tv .tv-focused {
      border-color: #39ff14 !important;
      box-shadow: 0 0 30px rgba(57, 255, 20, 0.7), 0 0 15px rgba(56, 189, 248, 0.9) !important;
      transform: scale(1.04) !important;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col justify-between items-center py-5 px-3 sm:px-6 md:px-8 lg:px-12 relative pb-28 md:pb-12">

  <!-- هاله‌های پس‌زمینه نئونی (آبی آسمانی و سبز فسفری) -->
  <div class="fixed -top-28 -right-28 w-[28rem] h-[28rem] bg-sky-400/20 dark:bg-sky-500/20 rounded-full blur-[140px] pointer-events-none animate-ambient-1"></div>
  <div class="fixed -bottom-28 -left-28 w-[30rem] h-[30rem] bg-emerald-400/20 dark:bg-emerald-500/20 rounded-full blur-[150px] pointer-events-none animate-ambient-2"></div>
  <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-lime-400/10 dark:bg-lime-400/10 rounded-full blur-[170px] pointer-events-none"></div>

  <!-- نوار کنترل بالای وب‌اپلیکیشن (تغییر تم، شناسه نوع دستگاه، اشتراک و بارکد) -->
  <header class="w-full max-w-6xl flex items-center justify-between mb-6 z-20 gap-2">
    
    <!-- شناسه و انتخاب‌گر وضعیت دستگاه (موبایل / تبلت / کامپیوتر / تلویزیون) -->
    <div class="flex items-center gap-2">
      <div class="glass-panel px-3 py-1.5 rounded-2xl flex items-center gap-2 text-xs font-semibold text-slate-700 dark:text-slate-300">
        <i id="deviceIndicatorIcon" class="fa-solid fa-mobile-screen text-sky-500"></i>
        <span id="deviceIndicatorText">حالت خودکار</span>
      </div>

      <!-- دکمه سوییچ مود نمایشی دستگاه‌ها برای تست آنی -->
      <button 
        onclick="cycleDeviceMode()" 
        class="glass-panel px-2.5 py-1.5 rounded-2xl text-[11px] text-slate-600 dark:text-slate-400 hover:text-sky-500 dark:hover:text-phosphor transition flex items-center gap-1.5"
        title="تغییر شبیه‌ساز دستگاه (موبایل/تبلت/دسکتاپ/تلویزیون)"
      >
        <i class="fa-solid fa-arrows-rotate text-[10px]"></i>
        <span class="hidden sm:inline">سوییچ محیط</span>
      </button>
    </div>

    <!-- دکمه‌های کنترل تم شب/روز و اشتراک‌گذاری -->
    <div class="flex items-center gap-2">
      <!-- دکمه تغییر هوشمند شب/روز -->
      <button 
        id="themeToggleBtn"
        onclick="toggleThemeManual()" 
        class="w-10 h-10 rounded-2xl glass-panel flex items-center justify-center text-slate-700 dark:text-slate-200 hover:text-sky-500 dark:hover:text-sky-300 active:scale-95 transition" 
        title="تغییر تم شب/روز"
        aria-label="تغییر تم"
      >
        <i id="themeIcon" class="fa-solid fa-moon text-base"></i>
      </button>

      <!-- دکمه بارکد QR -->
      <button 
        onclick="openQrModal()" 
        class="w-10 h-10 rounded-2xl glass-panel flex items-center justify-center text-slate-700 dark:text-slate-300 hover:text-sky-500 dark:hover:text-sky-300 active:scale-95 transition" 
        title="بارکد QR اختصاصی"
      >
        <i class="fa-solid fa-qrcode text-base"></i>
      </button>

      <!-- دکمه اشتراک‌گذاری دسکتاپ/تبلت -->
      <button 
        onclick="shareProfile()" 
        class="hidden sm:flex px-3.5 h-10 rounded-2xl glass-panel text-xs font-semibold items-center gap-1.5 text-sky-600 dark:text-sky-400 hover:opacity-85 active:scale-95 transition" 
        title="اشتراک‌گذاری وب‌اپلیکیشن"
      >
        <i class="fa-solid fa-share-nodes text-xs text-emerald-600 dark:text-phosphor"></i>
        <span>اشتراک‌گذاری</span>
      </button>
    </div>
  </header>

  <main id="appContainer" class="w-full max-w-6xl z-10 transition-all duration-300">
    
    <!-- محتوای رسپانسیو: در موبایل تک‌ستونه، در تبلت و دسکتاپ دو ستونه گلس‌مورفیک مدرن -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

      <!-- ستون اطلاعات پروفایل مرتضی آبنر (در دسکتاپ و تبلت سایدبار شیشه‌ای چسبنده) -->
      <aside class="lg:col-span-5 w-full">
        <div class="glass-panel p-6 sm:p-8 rounded-3xl flex flex-col items-center text-center relative overflow-hidden">
          
          <!-- جلوه نورانی نئونی بالا -->
          <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-48 h-20 bg-gradient-to-r from-sky-400/30 to-phosphor/20 blur-2xl pointer-events-none"></div>

          <!-- تصویر پروفایل -->
          <div class="relative group mb-4">
            <div class="absolute -inset-1.5 bg-gradient-to-r from-sky-400 via-emerald-400 to-phosphor rounded-full blur-md opacity-80 group-hover:opacity-100 transition duration-500 animate-pulse-glow"></div>
            <div class="relative w-28 h-28 sm:w-36 sm:h-36 rounded-full overflow-hidden border-2 border-sky-400/60 p-1 bg-white dark:bg-dark-base neon-glow-ring">
              <img 
                id="avatarImg"
                src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=500&q=80" 
                alt="مرتضی آبنر" 
                class="w-full h-full object-cover rounded-full transition duration-500 group-hover:scale-105"
                onerror="this.src='https://placehold.co/300x300/091426/38bdf8?text=Morteza+Abner'"
              >
            </div>
            <!-- بج تایید هویت رسمی -->
            <div class="absolute bottom-1 right-2 bg-gradient-to-r from-sky-400 to-emerald-400 text-slate-950 p-1.5 rounded-full shadow-lg text-xs" title="حساب رسمی مرتضی آبنر">
              <i class="fa-solid fa-check"></i>
            </div>
          </div>

          <!-- نام و نام کاربری -->
          <h1 class="text-2xl sm:text-3xl lg:text-4xl font-black tracking-tight neon-brand-title mb-1" id="profileName">
            مرتضی آبنر
          </h1>

          <div class="flex items-center gap-1.5 mt-1" dir="ltr">
            <span class="text-xs sm:text-sm font-semibold text-sky-600 dark:text-
