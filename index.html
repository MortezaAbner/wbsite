<script>
  (function(){
    var stored = localStorage.getItem('theme');
    var theme = stored ? stored : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<style>
  :root{ --radius:14px; --sky:#38bdf8; --purple:#7c3aed; --gradient: linear-gradient(135deg,#38bdf8 0%,#7c8cf8 45%,#a855f7 100%); }
  :root[data-theme="light"]{
    --bg-1:#eaf3ff; --bg-2:#f4eeff; --text:#1c1b2e; --muted:#5f5c7d; --border:rgba(124,58,237,.15);
    --glass-bg:rgba(255,255,255,.55); --glass-border:rgba(124,58,237,.18); --glass-shadow:0 8px 24px rgba(80,60,180,.10);
    --icon-color:#1c2a52; --header-bg:rgba(255,255,255,.55); --accent:#7c3aed;
    --selected-text:#ffffff;
  }
  :root[data-theme="dark"]{
    --bg-1:#0d1024; --bg-2:#160f2b; --text:#eef0fb; --muted:#a9a6cf; --border:rgba(168,133,255,.22);
    --glass-bg:rgba(255,255,255,.06); --glass-border:rgba(168,133,255,.28); --glass-shadow:0 8px 30px rgba(0,0,0,.45);
    --icon-color:#e4e6fb; --header-bg:rgba(20,16,40,.55); --accent:#a855f7;
    --selected-text:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Segoe UI","Vazirmatn","Tahoma",Arial,sans-serif; color:var(--text); line-height:1.6;
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(56,189,248,.28), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(168,85,247,.24), transparent 55%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    min-height:100vh; transition:background .3s ease, color .3s ease;
  }
  a{ color:inherit; text-decoration:none; }
  .glass{ background:var(--glass-bg); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--glass-border); box-shadow:var(--glass-shadow); }

  header{ display:flex; align-items:center; justify-content:space-between; padding:18px 40px; backdrop-filter:blur(12px); background:var(--header-bg); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
  .logo{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:1.2rem; letter-spacing:.2px; background:var(--gradient); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .logo svg{ width:20px; height:20px; -webkit-text-fill-color:initial; color:var(--purple); }
  nav{ display:flex; align-items:center; gap:16px; }
  nav a{ font-size:.95rem; color:var(--text); opacity:.85; }
  nav a:hover{ opacity:1; }
  .controls{ display:flex; align-items:center; gap:10px; }
  .icon-btn{ width:40px; height:40px; border-radius:999px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text); transition:transform .15s ease; }
  .icon-btn:hover{ transform:translateY(-2px); }
  .icon-btn svg{ width:18px; height:18px; }
  .lang-select{ position:relative; display:flex; align-items:center; gap:8px; font-size:.9rem; border-radius:999px; padding:8px 16px; cursor:pointer; }
  .lang-select select{ border:none; background:transparent; color:var(--text); font-size:.9rem; font-family:inherit; cursor:pointer; outline:none; appearance:none; padding-inline-end:14px; }
  .lang-select select option{ color:#111; }
  .lang-select::after{ content:"▾"; font-size:.7rem; position:absolute; left:12px; pointer-events:none; color:var(--purple); }

  .hero{ text-align:center; padding:110px 20px 70px; max-width:800px; margin:0 auto; }
  .hero h1{ font-size:2.9rem; font-weight:800; line-height:1.25; margin-bottom:18px; background:var(--gradient); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero p.subtitle{ color:var(--muted); font-size:1.2rem; margin-bottom:60px; }
  .hero h2{ font-size:1.05rem; font-weight:700; color:var(--purple); margin-bottom:30px; letter-spacing:.2px; }

  .os-grid{ display:flex; justify-content:center; flex-wrap:wrap; gap:18px; margin-bottom:20px; }
  .os-card{ display:flex; flex-direction:column; align-items:center; gap:12px; width:118px; padding:22px 12px; border-radius:var(--radius); transition:box-shadow .2s ease, transform .2s ease, background .2s ease, color .2s ease; cursor:pointer; }
  .os-card:hover{ transform:translateY(-4px); }
  .os-card.selected{ background:var(--gradient); color:var(--selected-text); border-color:transparent; box-shadow:0 14px 30px rgba(124,58,237,.35); }
  .os-icon{ width:44px; height:44px; display:flex; align-items:center; justify-content:center; color:var(--icon-color); transition:color .2s ease; }
  .os-card.selected .os-icon{ color:var(--selected-text); }
  .os-icon svg{ width:100%; height:100%; }
  .os-card span{ font-size:.85rem; font-weight:600; color:inherit; }

  .cta{ display:inline-block; padding:13px 34px; border-radius:999px; font-size:.95rem; font-weight:700; color:var(--text); margin-top:28px; transition:transform .15s ease; }
  .cta:hover{ transform:translateY(-2px); }

  .change-row{ text-align:start; margin-bottom:10px; }
  .change-link{ font-size:.85rem; color:var(--muted); cursor:pointer; }
  .change-link:hover{ color:var(--purple); }

  #appsSection{ display:none; max-width:800px; margin:0 auto 40px; text-align:start; }
  #appsSection h2{ text-align:end; font-size:1.05rem; font-weight:700; color:var(--purple); margin-bottom:24px; }

  .apps-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:16px; }
  .app-card{ border-radius:var(--radius); padding:18px; display:flex; flex-direction:column; gap:14px; }
  .app-card-top{ display:flex; align-items:flex-start; justify-content:space-between; }
  .app-name{ font-weight:700; font-size:1.05rem; margin-bottom:4px; }
  .app-os{ font-size:.72rem; color:var(--muted); letter-spacing:.4px; }
  .app-icon{ width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--icon-color); flex-shrink:0; }
  .app-icon svg{ width:18px; height:18px; }
  .app-link{ display:flex; align-items:center; gap:6px; font-size:.85rem; color:var(--purple); }
  .app-link svg{ width:14px; height:14px; }

  /* ---- App detail page ---- */
  .breadcrumb{ display:flex; align-items:center; gap:8px; font-size:.9rem; color:var(--muted); margin-bottom:22px; }
  .breadcrumb a{ color:var(--muted); cursor:pointer; }
  .breadcrumb a:hover{ color:var(--purple); }
  .breadcrumb .crumb-current{ color:var(--text); font-weight:600; }

  .detail-hero-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:24px; }
  .detail-title-block h1{ font-size:2.1rem; font-weight:700; margin-bottom:6px; color:var(--text); }
  .detail-os-row{ display:flex; align-items:center; gap:6px; color:var(--muted); font-size:.95rem; }
  .detail-os-row svg{ width:16px; height:16px; }
  .detail-icon-box{ width:56px; height:56px; border-radius:var(--radius); display:flex; align-items:center; justify-content:center; color:var(--icon-color); flex-shrink:0; }
  .detail-icon-box svg{ width:26px; height:26px; }

  .download-btn{ display:inline-flex; align-items:center; gap:8px; padding:12px 24px; border-radius:999px; border:1px solid var(--border); font-size:.9rem; font-weight:700; color:var(--text); margin-bottom:44px; cursor:pointer; transition:transform .15s ease; }
  .download-btn:hover{ transform:translateY(-2px); }
  .download-btn svg{ width:16px; height:16px; }

  .guides-heading{ font-size:1.05rem; font-weight:700; color:var(--purple); margin-bottom:20px; }

  .guides-list{ display:flex; flex-direction:column; gap:14px; }
  .guide-card{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:18px 22px; border-radius:var(--radius); cursor:pointer; transition:transform .2s ease; }
  .guide-card:hover{ transform:translateY(-3px); }
  .guide-card.ping{ border-left:3px solid #22c55e; }
  .guide-card.update{ border-left:3px solid #f59e0b; }
  .guide-card.setup{ border-left:3px solid #3b82f6; }
  .guide-chevron{ width:32px; height:32px; border-radius:999px; background:var(--glass-bg); display:flex; align-items:center; justify-content:center; color:var(--muted); flex-shrink:0; }
  .guide-chevron svg{ width:14px; height:14px; }
  .guide-label{ flex:1; font-weight:700; font-size:1rem; }
  .guide-icon{ width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--icon-color); flex-shrink:0; }
  .guide-icon svg{ width:18px; height:18px; }

  #appDetailSection{ display:none; max-width:800px; margin:0 auto 40px; text-align:start; }

  @media (max-width:640px){
    header{ padding:14px 18px; flex-wrap:wrap; gap:12px; }
    nav{ gap:16px; flex-wrap:wrap; }
    .hero{ padding:64px 16px 44px; }
    .hero h1{ font-size:2rem; }
    .detail-title-block h1{ font-size:1.6rem; }
  }
</style>
</head>

    document.documentElement.lang = lang;
    document.documentElement.dir = t.dir;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      const key = el.getAttribute('data-i18n');
      if(t[key] !== undefined) el.textContent = t[key];
    });
    renderApps();
    if(currentApp) renderAppDetail();
  }
  document.getElementById('langSwitcher').addEventListener('change', function(e){
    setLanguage(e.target.value);
  });

  function renderApps(){
    const section = document.getElementById('appsSection');
    if(!selectedOS){ section.style.display = 'none'; return; }
    section.style.display = 'block';
    const t = translations[currentLang];
    document.getElementById('changeLink').textContent = t.change_label;
    document.getElementById('appsHeading').textContent = t.choose_app.replace('{os}', selectedOS.toUpperCase());
    const grid = document.getElementById('appsGrid');
    grid.innerHTML = '';
    appsData[selectedOS].forEach(function(app){
      const card = document.createElement('div');
      card.className = 'app-card glass';
      card.innerHTML =
        '<div class="app-card-top">' +
          '<div><div class="app-name">' + app.name + '</div><div class="app-os">' + selectedOS.toUpperCase() + '</div></div>' +
          '<div class="app-icon">' + appIcons[app.icon] + '</div>' +
        '</div>' +
        '<a href="#" class="app-link">' + appIcons[app.icon] + '<span>' + t.view_guides + '</span></a>';
      card.addEventListener('click', function(e){
        e.preventDefault();
        openAppDetail(app.name, selectedOS);
      });
      grid.appendChild(card);
    });
  }

  /* ---- App detail page ---- */
  function openAppDetail(appName, os){
    currentApp = appName;
    currentAppOs = os;
    document.getElementById('homeContent').style.display = 'none';
    document.getElementById('appDetailSection').style.display = 'block';
    renderAppDetail();
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  function closeAppDetail(){
    currentApp = null;
    currentAppOs = null;
    document.getElementById('appDetailSection').style.display = 'none';
    document.getElementById('homeContent').style.display = 'block';
  }

  function renderAppDetail(){
    if(!currentApp) return;
    const t = translations[currentLang];

    document.getElementById('breadcrumbCurrent').textContent = currentApp;
    document.getElementById('detailAppName').textContent = currentApp;
    document.getElementById('detailOsName').textContent = osDisplayNames[currentAppOs] || currentAppOs;

    const osIconSrc = document.querySelector('.os-card[data-os="' + currentAppOs + '"] .os-icon svg');
    document.getElementById('detailOsIcon').innerHTML = osIconSrc ? osIconSrc.outerHTML : '';

    const appEntry = (appsData[currentAppOs] || []).find(function(a){ return a.name === currentApp; });
    document.getElementById('detailIconBox').innerHTML = appIcons[appEntry ? appEntry.icon : 'monitor'];

    const link = (downloadLinks[currentAppOs] && downloadLinks[currentAppOs][currentApp]) || '#';
    document.getElementById('downloadBtn').setAttribute('href', link);
    const storeName = storeNames[currentAppOs] ? storeNames[currentAppOs][currentLang] : '';
    document.getElementById('downloadBtnLabel').textContent = t.download_prefix + ' ' + storeName;
    document.getElementById('downloadBtnIcon').innerHTML = (currentAppOs === 'ios' || currentAppOs === 'macos') ? storeIcons.apple : storeIcons.generic;

    const list = document.getElementById('guidesList');
    list.innerHTML = '';
    guidesOrder.forEach(function(key){
      const card = document.createElement('div');
      card.className = 'guide-card glass ' + key;
      card.innerHTML =
        '<div class="guide-icon">' + guideIcons[key] + '</div>' +
        '<span class="guide-label">' + t['guide_' + key] + '</span>' +
        '<div class="guide-chevron"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
      list.appendChild(card);
    });
  }

  document.getElementById('breadcrumbGuides').addEventListener('click', function(e){
    e.preventDefault();
    closeAppDetail();
  });

  document.getElementById('changeLink').addEventListener('click', function(){
    selectedOS = null;
    document.querySelectorAll('.os-card').forEach(function(c){ c.classList.remove('selected'); });
    renderApps();
  });

  document.querySelectorAll('.os-card').forEach(function(card){
    card.addEventListener('click', function(){
      selectedOS = this.getAttribute('data-os');
      document.querySelectorAll('.os-card').forEach(function(c){ c.classList.remove('selected'); });
      this.classList.add('selected');
      renderApps();
    });
  });

  /* ---- theme (dark/light) ---- */
  const moonIcon = '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 7 7 0 0 0 20 14.5z" fill="currentColor"/>';
  const sunIcon = '<circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2 5.6 5.6"/></g>';
  const themeIconEl = document.getElementById('themeIcon');
  const themeToggleBtn = document.getElementById('themeToggle');
  function paintIcon(theme){ themeIconEl.innerHTML = theme === 'dark' ? sunIcon : moonIcon; }
  function applyTheme(theme){ document.documentElement.setAttribute('data-theme', theme); paintIcon(theme); }
  applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
  themeToggleBtn.addEventListener('click', function(){
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    localStorage.setItem('theme', next);
    applyTheme(next);
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e){
    if(!localStorage.getItem('theme')){ applyTheme(e.matches ? 'dark' : 'light'); }
  });
</script>

</body>
</html>
